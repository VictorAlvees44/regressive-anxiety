    <script>
      const rota = new URLSearchParams(location.search).get("__route");
      const base = "%BASE_URL%";
      if (rota && !rota.startsWith("/") && !rota.includes("\\")) {
        const destino = new URL(base + rota, location.origin);
        if (destino.origin === location.origin && destino.pathname.startsWith(base)) history.replaceState(null, "", destino.pathname + destino.search + destino.hash);
      }
    </script>
